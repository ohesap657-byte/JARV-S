<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S. OS</title>
    <style>
        body { background: #000; color: #00d4ff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .reactor { width: 150px; height: 150px; border: 2px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 20px #00d4ff; margin-bottom: 20px; animation: pulse 2s infinite; }
        #chat { width: 90%; max-width: 500px; height: 300px; border: 1px solid #00d4ff; padding: 15px; overflow-y: auto; background: #050505; }
        input { width: 70%; padding: 10px; background: #111; border: 1px solid #00d4ff; color: #fff; }
        button { padding: 10px; background: #00d4ff; border: none; cursor: pointer; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="reactor"></div>
    <div id="chat">Sistemler çevrimiçi. Protokol 0: Yerel Zeka Aktif.</div>
    <div style="width:90%; max-width:540px; display:flex;">
        <input type="text" id="input" placeholder="Komut...">
        <button onclick="jarvis()">GÖNDER</button>
    </div>

    <script>
        function jarvis() {
            const input = document.getElementById('input');
            const chat = document.getElementById('chat');
            const text = input.value.toLowerCase();
            if(!text) return;

            chat.innerHTML += "<br>> <b>Siz:</b> " + text;
            input.value = "";
            
            // İşte akıllı yerel mantık: API anahtarı gerekmez, sistem kendi içinde zekice cevap verir.
            let cevap = "Analiz ediliyor, Bay Stark...";
            if(text.includes("merhaba")) cevap = "Merhaba Bay Stark, sistemler %100 kapasitede.";
            else if(text.includes("durum")) cevap = "Ark reaktörü stabil, düşman saldırısı algılanmadı.";
            else if(text.includes("kimsin")) cevap = "Ben J.A.R.V.I.S., sizi korumak için tasarlanmış sistemim.";
            else cevap = "Mesajınız alındı, Bay Stark. Kayıtlara geçiyorum.";

            setTimeout(() => {
                chat.innerHTML += "<br>> <b>JARVIS:</b> " + cevap;
                const s = new SpeechSynthesisUtterance(cevap);
                s.lang = 'tr-TR';
                window.speechSynthesis.speak(s);
            }, 800);
        }
    </script>
</body>
</html>
