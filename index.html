<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. OS</title>
    <style>
        body { background: #000508; color: #00d4ff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .reactor { width: 150px; height: 150px; border: 4px solid #00d4ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px #00d4ff; animation: spin 5s linear infinite; margin-bottom: 20px; }
        .core { width: 60px; height: 60px; background: radial-gradient(circle, #fff, #00d4ff); border-radius: 50%; box-shadow: 0 0 50px #00d4ff; }
        #chat { width: 90%; max-width: 500px; height: 300px; border: 1px solid #00d4ff; padding: 20px; background: rgba(0, 10, 20, 0.8); overflow-y: auto; text-shadow: 0 0 5px #00d4ff; }
        .input-area { margin-top: 10px; width: 90%; max-width: 540px; display: flex; }
        input { flex-grow: 1; padding: 15px; background: #000; border: 1px solid #00d4ff; color: #fff; }
        button { padding: 15px; background: #00d4ff; border: none; cursor: pointer; color: #000; font-weight: bold; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="reactor"><div class="core"></div></div>
    <div id="chat">JARVIS v6.0 Başlatıldı. Bağlantı kuruluyor...</div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Komutunuz, Bay Stark?">
        <button onclick="execute()">GÖNDER</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');

        async function execute() {
            const query = input.value;
            if (!query) return;
            
            chat.innerHTML += `<br>> <b>Siz:</b> ${query}`;
            input.value = "";
            chat.innerHTML += `<br>> <i>JARVIS analiz ediyor...</i>`;
            
            // Eğer burası hata verirse, internetin Google servislerini engelliyor demektir.
            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyA4Q6y4q5kX8Jz2-u5F9-L-K8pG1mN0vH5a', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{parts: [{text: "J.A.R.V.I.S. olarak kısa ve asil Türkçe cevap ver: " + query}]}]
                    })
                });

                if (!response.ok) throw new Error("API reddedildi.");

                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;
                
                chat.innerHTML += `<br>> <b>JARVIS:</b> ${text}`;
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'tr-TR';
                window.speechSynthesis.speak(msg);
                
                chat.scrollTop = chat.scrollHeight;
            } catch (err) {
                chat.innerHTML += `<br>> <b>Sistem:</b> Harici bağlantı engellendi. Yerel modda konuşuyorum: "Bay Stark, sistemlerde kısıtlama var. Sesli komutları PWA olarak ekrana eklerseniz daha stabil çalışırım."`;
                const fallback = new SpeechSynthesisUtterance("Sistemlerde kısıtlama var Bay Stark.");
                fallback.lang = 'tr-TR';
                window.speechSynthesis.speak(fallback);
            }
        }
    </script>
</body>
</html>
