<!DOCTYPE html>
<html>
<head>
    <title>J.A.R.V.I.S. V4.2.1</title>
</head>
<body style="background: black; color: cyan; font-family: monospace;">
    <h1>Sistemler Aktif, Bay Stark.</h1>
    <textarea id="input" placeholder="Komut girin, Bay Stark..."></textarea>
    <button onclick="jarvisSpeak()">GÖNDER</button>
    <p id="response"></p>

    <script>
        async function jarvisSpeak() {
            const prompt = document.getElementById('input').value;
            // Gemini Zekası Bağlantısı
            const geminiResponse = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyBw-x8T7Ww9v1XzYpQ-r5Lk8mN2jH3vG4a', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({contents: [{parts: [{text: prompt}]}]})
            });
            const data = await geminiResponse.json();
            const text = data.candidates[0].content.parts[0].text;
            document.getElementById('response').innerText = text;

            // ElevenLabs Ses Bağlantısı
            const audioResponse = await fetch('https://api.elevenlabs.io/v1/text-to-speech/wDsJlOXPqcvIUKdLXjDs', {
                method: 'POST',
                headers: {
                    'xi-api-key': 'sk_2926978e63342f9ce27cec764b0ff32cbee73f29e16c31be',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({text: text})
            });
            const audioBlob = await audioResponse.blob();
            const audioUrl = URL.createObjectURL(audioBlob);
            new Audio(audioUrl).play();
        }
    </script>
</body>
</html>
