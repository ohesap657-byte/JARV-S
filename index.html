<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Stark Industries</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #000508;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            color: #00d4ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* HUD Çizgileri ve Tarama Efekti */
        .scanline {
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent 50%, rgba(0, 212, 255, 0.02) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            z-index: 2;
        }
        /* Geliştirilmiş Ark Reaktörü */
        .arc-reactor {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px dashed #00d4ff;
            animation: rotateRing 4s linear infinite;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }
        .core {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff, #00d4ff, #0044aa);
            box-shadow: 0 0 30px #00d4ff, inset 0 0 10px #ffffff;
            animation: pulseCore 1.5s ease-in-out infinite alternate;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px #00d4ff;
        }
        /* Konsol Ekranı */
        .chat-box {
            background: rgba(0, 20, 35, 0.6);
            border: 1px solid #00d4ff;
            border-radius: 6px;
            padding: 15px;
            min-height: 120px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            text-align: left;
            box-shadow: inset 0 0 15px rgba(0, 212, 255, 0.2);
            font-size: 14px;
            line-height: 1.5;
        }
        /* Girdi Paneli */
        .input-panel {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background: rgba(0, 10, 20, 0.8);
            border: 1px solid #00d4ff;
            padding: 12px;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 15px;
            border-radius: 4px;
            outline: none;
        }
        input:focus {
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        button {
            background: transparent;
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 0 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #00d4ff;
            color: #000508;
            box-shadow: 0 0 15px #00d4ff;
        }
        /* Animasyonlar */
        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulseCore {
            from { transform: scale(0.9); opacity: 0.8; }
            to { transform: scale(1.05); opacity: 1; }
        }
        @keyframes blink {
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    
    <div class="container">
        <!-- Ark Reaktörü -->
        <div class="arc-reactor">
            <div class="ring"></div>
            <div class="core" id="reactor-core"></div>
        </div>

        <h1>J.A.R.V.I.S. HİZMETİNİZDE</h1>
        
        <!-- Cevap Alanı -->
        <div class="chat-box" id="jarvis-status">
            Sistemler aktif, Bay Stark. Bir komut bekleniyor...
        </div>

        <!-- Giriş Kutusu ve Buton -->
        <div class="input-panel">
            <input type="text" id="stark-command" placeholder="Komutunuzu girin, Bay Stark..." onkeypress="if(event.key === 'Enter') sendCommand()">
            <button onclick="sendCommand()">GÖNDER</button>
        </div>
    </div>

    <script>
    async function sendCommand() {
        // Senin tasarımındaki input ve chatbox ID'lerini burada doğru yazdığından emin ol
        const inputField = document.getElementById('stark-command'); 
        const statusBox = document.getElementById('jarvis-status');
        const command = inputField.value;

        statusBox.innerText = "İşleniyor...";

        // 1. Zeka (Gemini)
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyBw-x8T7Ww9v1XzYpQ-r5Lk8mN2jH3vG4a', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({contents: [{parts: [{text: "Kısa ve asil bir J.A.R.V.I.S. gibi Türkçe cevap ver: " + command}]}]})
        });
        const data = await res.json();
        const answer = data.candidates[0].content.parts[0].text;
        
        statusBox.innerText = answer;

        // 2. Ses (Tarayıcı motoru - en garanti yöntem)
        const msg = new SpeechSynthesisUtterance(answer);
        msg.lang = 'tr-TR';
        window.speechSynthesis.speak(msg);
    }
    </script>
