<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S. OS</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; background: #000508; color: #00d4ff; font-family: 'Share Tech Mono', monospace; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // Senin gönderdiğin profesyonel tasarımın "beyin" kısmını buraya entegre ettim.
        // Hata vermemesi için API çağrılarını en güvenli (Native Web Speech API) yöntemle bağladım.
        
        function App() {
            const [input, setInput] = React.useState("");
            const [messages, setMessages] = React.useState([{role: 'assistant', content: 'Sistemler aktif, Bay Stark.'}]);

            const speak = (text) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'tr-TR';
                utterance.pitch = 1;
                utterance.rate = 1;
                window.speechSynthesis.speak(utterance);
            };

            const handleSend = async () => {
                if(!input) return;
                const userMsg = input;
                setMessages(prev => [...prev, {role: 'user', content: userMsg}]);
                setInput("");

                // Gemini ile akıllı bağlantı
                try {
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyA4Q6y4q5kX8Jz2-u5F9-L-K8pG1mN0vH5a', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({contents: [{parts: [{text: "J.A.R.V.I.S. gibi kısa, asil ve etkileyici cevap ver: " + userMsg}]}]})
                    });
                    const data = await response.json();
                    const reply = data.candidates[0].content.parts[0].text;
                    setMessages(prev => [...prev, {role: 'assistant', content: reply}]);
                    speak(reply);
                } catch(e) {
                    speak("Sistem hatası, tekrar deniyorum.");
                }
            };

            return (
                <div style={{padding: '20px'}}>
                    <h1>J.A.R.V.I.S.</h1>
                    <div style={{border: '1px solid #00d4ff', height: '300px', overflowY: 'scroll', marginBottom: '10px'}}>
                        {messages.map((m, i) => <p key={i}><b>{m.role}:</b> {m.content}</p>)}
                    </div>
                    <input value={input} onChange={(e) => setInput(e.target.value)} style={{background:'black', color:'#00d4ff'}} />
                    <button onClick={handleSend}>GÖNDER</button>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
