<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. OS</title>
    <style>
        /* CSS TASARIMIN (Ark Reaktörü ve HUD) */
        body { background: #000508; color: #00d4ff; font-family: 'Share Tech Mono', monospace; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .arc-reactor { width: 150px; height: 150px; border: 3px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 20px #00d4ff; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; animation: pulse 2s infinite; }
        .core { width: 60px; height: 60px; background: radial-gradient(#fff, #00d4ff); border-radius: 50%; box-shadow: 0 0 40px #00d4ff; }
        #chat-container { width: 90%; max-width: 500px; height: 250px; border: 1px solid #00d4ff; padding: 15px; overflow-y: auto; background: rgba(0, 20, 40, 0.5); margin-bottom: 10px; border-radius: 5px; }
        input { width: 70%; padding: 10px; background: #000; border: 1px solid #00d4ff; color: #00d4ff; }
        button { padding: 10px; background: #00d4ff; border: none; color: #000; font-weight: bold; cursor: pointer; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
</head>
<body>
    <div class="arc-reactor"><div class="core"></div></div>
    <div id="chat-container">Sistemler çevrimiçi, Bay Stark.</div>
    <div style="width: 100%; text-align: center;">
        <input type="text" id="user-input" placeholder="Komut girin...">
        <button onclick="jarvisProcess()">GÖNDER</button>
    </div>

    <script>
        // API anahtarını doğrudan fonksiyon içine gömdük.
        const API_KEY = "AIzaSyA4Q6y4q5kX8Jz2-u5F9-L-K8pG1mN0vH5a";
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        async function jarvisProcess() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const userText = inputField.value;

            if (!userText) return;

            chatContainer.innerHTML += `<br><b>Stark:</b> ${userText}`;
            inputField.value = "";
            chatContainer.innerHTML += `<br><i>JARVIS analiz ediyor...</i>`;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Sen bir yapay zekasın. J.A.R.V.I.S. olarak asil ve kısa bir Türkçe cevap ver: " + userText }] }]
                    })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;

                chatContainer.innerHTML += `<br><b>JARVIS:</b> ${reply}`;
                
                // SESLENDİRME (Browser Native)
                const speech = new SpeechSynthesisUtterance(reply);
                speech.lang = 'tr-TR';
                speech.rate = 1;
                window.speechSynthesis.speak(speech);
            } catch (error) {
                chatContainer.innerHTML += `<br><b>Sistem:</b> Bağlantı hatası oluştu, Bay Stark.`;
                console.error(error);
            }
        }
    </script>
</body>
</html>
