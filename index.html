                className={`message ${
                  m.role === "user" ? "message-user" : "message-jarvis"
                }`}
              >
                <div className="message-avatar">
                  {m.role === "user" ? "USER" : "JARVIS"}
                </div>
                <div className="message-bubble">{m.content}</div>
              </div>
            ))}
            {loading && (
              <div className="message message-jarvis">
                <div className="message-avatar">JARVIS</div>
                <div className="loading-dots">
                  <span /> <span /> <span />
                </div>
              </div>
            )}
          </div>

          <div className="input-area">
            <span className="input-prefix">&gt;</span>
            <input
              ref={inputRef}
              type="text"
              className="input-field"
              placeholder="Komutunuz, Bay Stark?"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKey}
              disabled={loading}
            />
            <button className="send-btn" onClick={sendMessage} disabled={loading}>
              {loading ? "İŞLENİYOR" : "GÖNDER"}
            </button>
          </div>
        </div>

        {/* Sidebar Panel */}
        <aside className="sidebar">
          <div className="arc-panel">
            <span className="panel-label">GÜÇ ÇEKİRDEĞİ</span>
            <ArcReactor pulse={pulse} />
          </div>
          <div className="status-panel">
            <StatusBar stats={stats} />
          </div>
        </aside>
      </div>
    </>
  );
}
