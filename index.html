<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S. VOICE</title>
    <style>
        body { background: #000; color: #00d4ff; font-family: 'Courier New', monospace; text-align: center; overflow: hidden; }
        .hud { border: 1px solid #00d4ff; padding: 20px; margin: 20px; box-shadow: 0 0 10px #00d4ff; }
        #arc { width: 150px; height: 150px; border: 2px solid #00d4ff; border-radius: 50%; margin: auto; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 10px #00d4ff; } 50% { box-shadow: 0 0 30px #00d4ff; } }
    </style>
</head>
<body>
    <div id="arc"></div>
    <div class="hud">
        <p id="status">SİSTEMLER HAZIR, BAY STARK.</p>
        <textarea id="metin" placeholder="JARVIS'e ne söyletmek istersin?" style="background:#111; color:#00d4ff; width:80%;"></textarea><br>
        <button onclick="konus()" style="background:#00d4ff; border:none; padding:10px; margin-top:10px;">KOMUTU İŞLE</button>
    </div>

    <script>
        function konus() {
            const metin = document.getElementById('metin').value || "Sistemler nominal, Bay Stark.";
            const msg = new SpeechSynthesisUtterance(metin);
            
            // JARVIS Ses Tonu Ayarı (Mümkün olan en tok sesi seçiyoruz)
            const voices = window.speechSynthesis.getVoices();
            msg.voice = voices.find(v => v.lang === 'tr-TR') || voices[0];
            msg.rate = 0.9; // Daha ağır ve otoriter bir hız
            msg.pitch = 0.8; // Daha tok bir ton
            
            window.speechSynthesis.speak(msg);
            document.getElementById('status').innerText = "İŞLENİYOR...";
        }
    </script>
</body>
</html>
