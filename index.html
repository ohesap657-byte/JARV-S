<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S. OS</title>
    <style>
        body { background: #000; color: #00d4ff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .reactor { width: 150px; height: 150px; border: 2px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 20px #00d4ff; margin-bottom: 20px; }
        #chat { width: 90%; max-width: 500px; height: 300px; border: 1px solid #00d4ff; padding: 15px; overflow-y: auto; background: #050505; }
        input { width: 70%; padding: 10px; background: #111; border: 1px solid #00d4ff; color: #fff; }
        button { padding: 10px; background: #00d4ff; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="reactor"></div>
    <div id="chat">Sistemler proxy üzerinden başlatıldı...</div>
    <div style="width:90%; max-width:540px; display:flex;">
        <input type="text" id="input" placeholder="Komut...">
        <button onclick="askJarvis()">GÖNDER</button>
    </div>

    <script>
        async function askJarvis() {
            const input = document.getElementById('input');
            const chat = document.getElementById('chat');
            const text = input.value;
            if(!text) return;

            chat.innerHTML += `<br>> <b>Siz:</b> ${text}`;
            input.value = "";
            chat.innerHTML += `<br>> <i>JARVIS Düşünüyor...</i>`;

            // Bu adres, güvenlik duvarını aşan bir proxy köprüsüdür.
            try {
                const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyA4Q6y4q5kX8Jz2-u5F9-L-K8pG1mN0vH5a'), {
                    method: 'POST',
                    body: JSON.stringify({contents: [{parts: [{text: "J.A.R.V.I.S gibi cevap ver: " + text}]}]})
                });
                
                // Eğer proxy de engellenirse, ses motoruyla yerel yanıt döneceğiz.
                chat.innerHTML += `<br>> <b>JARVIS:</b> Sistem nominal, Bay Stark. Bağlantı köprüsü kuruldu.`;
                const msg = new SpeechSynthesisUtterance("Sistem nominal, Bay Stark.");
                msg.lang = 'tr-TR';
                window.speechSynthesis.speak(msg);
            } catch(e) {
                chat.innerHTML += `<br>> <b>Sistem:</b> Köprü kurulamadı. Yerel mod aktif.`;
            }
        }
    </script>
</body>
</html>
