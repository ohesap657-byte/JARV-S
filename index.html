        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { background: #000; color: #00d4ff; font-family: 'Orbitron', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        /* Hareketli Ark Reaktörü */
        .reactor { width: 200px; height: 200px; border: 4px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 50px #00d4ff; animation: spin 10s linear infinite; position: relative; }
        .reactor::after { content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; border: 2px dashed #00d4ff; border-radius: 50%; animation: spin 5s linear reverse infinite; }
        
        /* HUD Detayları */
        .hud-overlay { position: absolute; top: 20px; width: 90%; display: flex; justify-content: space-between; font-size: 10px; border-bottom: 1px solid #00d4ff; padding-bottom: 5px; }
        
        #chat-box { width: 80%; height: 150px; background: rgba(0, 50, 60, 0.3); border: 1px solid #00d4ff; padding: 15px; margin: 20px; overflow-y: auto; text-align: left; }
        input { background: #000; border: 1px solid #00d4ff; color: #fff; padding: 10px; width: 60%; }
    </style>
</head>
