<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S. OS</title>
    <style>
        body { background: #000; color: #00d4ff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .reactor { width: 150px; height: 150px; border: 2px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 20px #00d4ff; margin-bottom: 20px; }
        #chat { width: 90%; max-width: 500px; height: 300px; border: 1px solid #00d4ff; padding: 15px; overflow-y: auto; background: #050505; }
        input { width: 70%; padding: 10px; background: #111; border: 1px solid #00d4ff; color: #fff; }
        button { padding: 10px; background: #00d4ff; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="reactor"></div>
    <div id="chat">Sistemler çevrimiçi, Bay Stark.</div>
    <div style="width:90%; max-width:540px; display:flex;">
        <input type="text" id="input" placeholder="Komut...">
        <button onclick="cevapla()">GÖNDER</button>
    </div>

    <script>
        function cevapla() {
            const input = document.getElementById('input');
            const chat = document.getElementById('chat');
            const text = input.value;
            if(!text) return;

            chat.innerHTML += "<br>> <b>Siz:</b> " + text;
            input.value = "";
            chat.innerHTML += "<br>> <b>JARVIS:</b> Sistemler nominal, Bay Stark.";
            
            const msg = new SpeechSynthesisUtterance("Sistemler nominal, Bay Stark.");
            msg.lang = 'tr-TR';
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
