<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://android.com"
    package="com.example.jarvisasistan">

    <!-- Mikrofon ve Ses Kayıt İzni -->
    <uses-permission android:name="android.permission.RECORD_AUDIO"/>

    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="Jarvis Asistan"
        android:roundIcon="@mipmap/ic_launcher_round"
        android:supportsRtl="true"
        android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
        
        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>

                </manifest>
                    <?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://android.com"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical"
    android:gravity="center"
    android:padding="16dp">

    <!-- Söylenen komutun ekranda görüneceği alan -->
    <TextView
        android:id="@+id/txtSonuc"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Jarvis Hazır. Butona Basın!"
        android:textSize="20sp"
        android:layout_marginBottom="30dp"
        android:textAlignment="center"/>

    <!-- Dinlemeyi başlatan buton -->
    <Button
        android:id="@+id/btnDinle"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Konuşmak İçin Dokun"
        android:padding="15dp"
        android:textSize="16sp"/>

    </LinearLayout>
