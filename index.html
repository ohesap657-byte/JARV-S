<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S. OS</title>
    <style>
        body { background: #000; color: #00d4ff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #arc-reactor { width: 150px; height: 150px; border: 2px solid #00d4ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px #00d4ff; margin-bottom: 20px; }
        .core { width: 50px; height: 50px; background: #00d4ff; border-radius: 50%; box-shadow: 0 0 50px #00d4ff; }
        #chat-box { width: 90%; max-width: 400px; height: 200px; border: 1px solid #00d4ff; padding: 10px; overflow-y: auto; margin-bottom: 10px; background: #0a0a0a; }
        input { width: 80%; background: #111; color: #00d4ff; border: 1px solid #00d4ff; padding: 10px; }
        button { background: #00d4ff; border: none; padding: 10px; cursor: pointer; color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <div id="arc-reactor"><div class="core"></div></div>
    <div id="chat-box">Sistem nominal. Komut girin, Bay Stark.</div>
    <div>
        <input type="text" id="user-input" placeholder="Komut...">
        <button onclick="send()">GÖNDER</button>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-box');
            const msg = input.value;
            if(!msg) return;

            chat.innerHTML += `<br><b>Siz:</b> ${msg}`;
            input.value = "";
            chat.innerHTML += `<br><i>Analiz ediliyor...</i>`;

            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyA4Q6y4q5kX8Jz2-u5F9-L-K8pG1mN0vH5a', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents: [{parts: [{text: "Kısa ve asil bir J.A.R.V.I.S. gibi Türkçe cevap ver: " + msg}]}]})
                });
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                
                chat.innerHTML += `<br><b>JARVIS:</b> ${reply}`;
                const utterance = new SpeechSynthesisUtterance(reply);
                utterance.lang = 'tr-TR';
                window.speechSynthesis.speak(utterance);
            } catch(e) {
                chat.innerHTML += `<br><b>Sistem:</b> Bağlantı hatası.`;
            }
        }
    </script>
</body>
</html>
