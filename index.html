<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. V4.2.1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #000508;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            color: #00d4ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        /* Ark Reaktörü Tasarımı */
        .arc-reactor {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        .ring {
            border-radius: 50%;
            border: 2px solid #00d4ff;
            position: absolute;
            width: 100%;
            height: 100%;
            animation: ringPulse 2s ease-in-out infinite;
            box-shadow: 0 0 20px #00d4ff, inset 0 0 20px #00d4ff;
        }
        .core {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff, #00d4ff, #0066aa);
            animation: corePulse 0.5s ease-in-out infinite alternate;
            box-shadow: 0 0 30px #00d4ff;
        }
        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        @keyframes corePulse {
            from { box-shadow: 0 0 20px #00d4ff; }
            to { box-shadow: 0 0 40px #00d4ff; }
        }
        /* Konsol Ekranı */
        h1 {
            font-size: 24px;
            text-shadow: 0 0 10px #00d4ff;
            margin-bottom: 20px;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 80px;
            background: rgba(0, 20, 30, 0.8);
            border: 1px solid #00d4ff;
            border-radius: 5px;
            color: #fff;
            padding: 10px;
            font-family: monospace;
            resize: none;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            background: #00d4ff;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 15px #00d4ff;
            transition: all 0.3s;
        }
        button:hover {
            background: #fff;
            box-shadow: 0 0 25px #fff;
        }
        #response {
            margin-top: 25px;
            min-height: 50px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.5;
            text-shadow: 0 0 5px #00d4ff;
        }
        @keyframes blink {
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="arc-reactor">
        <div class="ring"></div>
        <div class="core"></div>
    </div>

    <div class="container">
        <h1>Sistemler Aktif, Bay Stark.</h1>
        <textarea id="input" placeholder="Komut girin, Bay Stark..."></textarea>
        <button onclick="jarvisSpeak()">PROTOKOLÜ BAŞLAT</button>
        <div id="response"></div>
    </div>

    <script>
        const SYSTEM_INSTRUCTION = "Sen Iron Man filmindeki yapay zeka J.A.R.V.I.S.'sin. Kullanıcın Tony Stark (Bay Stark). Konuşma tarzın her zaman son derece kibar, asil, sadık, hafif ingiliz aksanlı bir beyefendi gibi olmalı. Cevapların çok uzun olmasın, net ve sinematik olsun. Türkçe cevap ver.";

        async function jarvisSpeak() {
            const prompt = document.getElementById('input').value;
            const responseDiv = document.getElementById('response');
            if (!prompt.trim()) return;

            responseDiv.innerHTML = "<span style='animation: blink 1s infinite;'>Analiz ediliyor, Bay Stark...</span>";

            try {
                // 1. ADIM: Gemini Zekası
                const geminiResponse = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyBw-x8T7Ww9v1XzYpQ-r5Lk8mN2jH3vG4a', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents: [{parts: [{text: SYSTEM_INSTRUCTION + "\n\nBay Stark: " + prompt}]}]})
                });
                const data = await geminiResponse.json();
                const text = data.candidates[0].content.parts[0].text;
                responseDiv.innerText = text;

                // 2. ADIM: ElevenLabs Ses Motoru
                const audioResponse = await fetch('https://api.elevenlabs.io/v1/text-to-speech/wDsJlOXPqcvIUKdLXjDs', {
                    method: 'POST',
                    headers: {
                        'xi-api-key': 'sk_2926978e63342f9ce27cec764b0ff32cbee73f29e16c31be',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                    })
                });

                if(audioResponse.ok) {
                    const audioBlob = await audioResponse.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    audio.play().catch(e => console.log("Ses otomatik oynatılamadı, tarayıcı izni gerekiyor:", e));
                }

            } catch (error) {
                responseDiv.innerText = "Güvenli bağlantı hatası, Bay Stark.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
