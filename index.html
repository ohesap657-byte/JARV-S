<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>J.A.R.V.I.S. OS | Stark Industries</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body { 
            background: #000508; 
            color: #00d4ff; 
            font-family: 'Orbitron', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { letter-spacing: 5px; text-shadow: 0 0 15px #00d4ff; margin: 0; }
        
        /* Ark Reaktörü Tasarımı */
        .reactor { 
            width: 150px; height: 150px; 
            border: 4px solid #00d4ff; border-radius: 50%; 
            box-shadow: 0 0 30px #00d4ff; 
            margin-bottom: 30px; 
            animation: spin 10s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Google Embed Container */
        .ai-container { 
            width: 90%; 
            max-width: 600px; 
            height: 400px; 
            border: 1px solid #00d4ff; 
            background: #000; 
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>J.A.R.V.I.S. OS</h1>
        <p>STARK INDUSTRIES · SİSTEM AKTİF</p>
    </div>

    <div class="reactor"></div>

    <div class="ai-container">
        <iframe src="https://aistudio.google.com/embed/chat/..." allow="microphone *"></iframe>
    </div>

    <script>
        console.log("Sistemler nominal, Bay Stark.");
    </script>
</body>
</html>
